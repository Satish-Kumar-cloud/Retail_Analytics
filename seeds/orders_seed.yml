version: 2

seeds:

  - name: orders

    description: |
      Retail order header information.

      Grain:
      One row represents one customer order.

    columns:

      - name: ORDER_ID
        description: |
          Unique identifier for the customer order.

        tests:
          - unique
          - not_null


      - name: CUSTOMER_ID
        description: |
          Identifier of the customer who placed the order.

        tests:
          - not_null


      - name: STORE_ID
        description: |
          Identifier of the store where the order was placed.

        tests:
          - not_null


      - name: ORDER_DATE
        description: |
          Date on which the customer order was placed.

        tests:
          - not_null


      - name: ORDER_STATUS
        description: |
          Current status of the customer order.

        tests:
          - not_null

          - accepted_values:
              values:
                - COMPLETED
                - CANCELLED
                - RETURNED


      - name: ORDER_TOTAL
        description: |
          Total monetary value of the order.

        tests:
          - not_null